[package]
name = "lingua-bridge-desktop"
version = "0.1.0"
description = "LinguaBridge MVP desktop client"
authors = ["LinguaBridge"]
edition = "2021"

[lib]
name = "lingua_bridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_System_Com", "Win32_Foundation"] }
